<!doctype html><html lang="pt-MZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#173c2b"><title>Protocolo — Recepção dos convidados</title><link rel="stylesheet" href="/protocol.css"><script src="/protocol.js" defer></script></head><body><header><div><p>Alírio &amp; Engrácia</p><h1>Recepção dos convidados</h1></div><button id="logout" type="button">Sair</button></header><main><section class="search-panel"><label for="search">Nome ou código do convite</label><input id="search" type="search" autocomplete="off" placeholder="Ex.: Maria ou 0A00"><div class="tools"><select id="filter" aria-label="Filtrar presenças"><option value="all">Todos</option><option value="waiting">Por chegar</option><option value="partial">Chegada parcial</option><option value="present">Todos presentes</option></select><button id="refresh" type="button">Actualizar</button></div><p id="summary"></p><p id="status" role="status" aria-live="polite">A carregar…</p></section><section id="guests" aria-label="Lista de convidados"></section></main><dialog id="detail"><div class="dialog-head"><h2 id="guest-name"></h2><button id="close" type="button" aria-label="Fechar">×</button></div><p id="guest-category"></p><p id="guest-summary"></p><p>Cada código representa uma pessoa. Marque apenas as pessoas que chegaram.</p><div id="seats"></div><p id="detail-status" role="status" aria-live="polite"></p></dialog></body></html>

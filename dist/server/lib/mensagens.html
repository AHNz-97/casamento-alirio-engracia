<!doctype html>
<html lang="pt-MZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e2b1f" />
    <title>Mensagens para Alírio &amp; Engrácia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/mensagens.css" />
    <script src="/mensagens.js" defer></script>
  </head>
  <body>
    <main class="screen">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <header>
        <a href="/">A <i>&amp;</i> E</a>
        <div class="header-actions">
          <span id="connection-state">A preparar mensagens</span>
          <button id="previous-button" type="button" aria-label="Mensagem anterior">Anterior</button>
          <button id="pause-button" type="button">Pausar</button>
          <button id="next-button" type="button" aria-label="Mensagem seguinte">Seguinte</button>
          <button id="fullscreen-button" type="button">Ecrã inteiro</button>
        </div>
      </header>

      <section class="message-stage" aria-live="polite">
        <p class="eyebrow">Mensagens dos nossos convidados</p>
        <div class="message-card" id="message-card">
          <img id="message-photo" alt="" hidden />
          <div id="table-placeholder" hidden><span class="table-symbol" aria-hidden="true">▤</span><strong id="table-label"></strong></div>
          <div id="message-copy"><blockquote id="message-text">As mensagens aprovadas aparecerão aqui.</blockquote>
          <p id="message-name">Alírio &amp; Engrácia</p></div>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        <p class="counter" id="message-counter">A preparar apresentação</p>
      </section>

      <footer>
        <p>Alírio <i>&amp;</i> Engrácia</p>
        <span>4 de outubro de 2026 · Inharrime</span>
      </footer>
    </main>
  </body>
</html>
